<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 572" width="1280" height="572" role="img" aria-label="What the script checks: claims the diff contradicts, tests that prove nothing, and fixes made in the wrong copy">
<style>
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="1278" height="570" rx="28" fill="#F6F9FF" stroke="#DCE5F5" stroke-width="2"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0A6CFF">WHAT IT CHECKS</text>
<g class="pop" style="animation-delay:0.20s"><rect x="40" y="80" width="384" height="5" rx="2.5" fill="#0A6CFF"/><text x="40" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Said it, didn't do it</text><text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">the diff contradicts the sentence</text></g><g class="pop" style="animation-delay:0.90s"><rect x="40" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">file-not-in-diff</text><text x="70" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">'fixed x.ts', and x.ts never changed</text></g><g class="pop" style="animation-delay:1.02s"><rect x="40" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">tests-claimed-none-changed</text><text x="70" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">'added tests', and no test changed</text></g><g class="pop" style="animation-delay:1.14s"><rect x="40" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">removed-still-referenced</text><text x="70" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">deleted a file something still imports</text></g><g class="pop" style="animation-delay:1.26s"><rect x="40" y="440" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">wired-but-unimported</text><text x="70" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">'wired it up', and nothing calls it</text></g><g class="pop" style="animation-delay:0.45s"><rect x="448" y="80" width="384" height="5" rx="2.5" fill="#6CCBFF"/><text x="448" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Green, but proves nothing</text><text x="448" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">tests that can't fail for the right reason</text></g><g class="pop" style="animation-delay:1.38s"><rect x="448" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">tests-never-import-changed</text><text x="478" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">the tests import none of the changed code</text></g><g class="pop" style="animation-delay:1.50s"><rect x="448" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">skip-added</text><text x="478" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">a skip or only added to get to green</text></g><g class="pop" style="animation-delay:1.62s"><rect x="448" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">test-selection-changed</text><text x="478" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">a config quietly drops a test</text></g><g class="pop" style="animation-delay:1.74s"><rect x="448" y="440" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">behaviour-claim-tests-edited</text><text x="478" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">'no behaviour change', assertions edited</text></g><g class="pop" style="animation-delay:0.70s"><rect x="856" y="80" width="384" height="5" rx="2.5" fill="#D97706"/><text x="856" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Fixing the wrong copy</text><text x="856" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">why the agent goes in circles</text></g><g class="pop" style="animation-delay:1.86s"><rect x="856" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#D97706" stroke-opacity=".6" stroke-width="2"/><text x="886" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">orphan rounds</text><text x="886" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">dead code kept alive by other dead code</text></g><g class="pop" style="animation-delay:1.98s"><rect x="856" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#D97706" stroke-opacity=".6" stroke-width="2"/><text x="886" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">twin</text><text x="886" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">two files, one name: which one runs</text></g><g class="pop" style="animation-delay:2.10s"><rect x="856" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#D97706" stroke-opacity=".6" stroke-width="2"/><text x="886" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">kept alive only by tests</text><text x="886" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">a green test on code no user reaches</text></g>
</svg>
